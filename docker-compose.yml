services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_MODE: ${NEXT_PUBLIC_API_MODE}
        NEXT_PUBLIC_API_BASE_URL_PRODUCTION: ${NEXT_PUBLIC_API_BASE_URL_PRODUCTION}
        NEXT_PUBLIC_API_FACEBOOK_POSTS_PATH: ${NEXT_PUBLIC_API_FACEBOOK_POSTS_PATH}
        NEXT_PUBLIC_API_USE_SAME_ORIGIN_PROXY: ${NEXT_PUBLIC_API_USE_SAME_ORIGIN_PROXY}
    image: taizihui-web:prod
    container_name: taizihui-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
